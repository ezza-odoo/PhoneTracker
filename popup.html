<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Call</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>

  <body>
    <form id="ticketForm">
      <label for="title">Caller Name:</label>
      <input type="text" id="title" name="title" placeholder="Ahmad" required />

      <label for="phone">Phone:</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+9711234567"
        aria-describedby="phoneError"
      />
      <span class="field-error hide" id="phoneError">
        Phone number must start with +(country code) (e.g.+971501234567).
      </span>
      <label for="tracking">Tracking(Sub/Email/DB):</label>
      <input
        type="text"
        id="tracking"
        name="tracking"
        placeholder="M1234567891"
        required
      />

      <fieldset>
        <legend>Ticket Type:</legend>
        <label>
          <input
            type="radio"
            id="stage-func"
            name="stage"
            value="91176"
            required
          />
          Functional
        </label>
        <label>
          <input
            type="radio"
            id="stage-admin"
            name="stage"
            value="91182"
            required
          />
          Administration
        </label>
        <label>
          <input
            type="radio"
            id="stage-other"
            name="stage"
            value="92099"
            required
          />
          Other
        </label>
      </fieldset>

      <label for="descriptionInput">Details:</label>
      <textarea
        id="descriptionInput"
        name="description"
        placeholder="What is the Purpose of this Call?&#10;&#10;&#10;What action did you take?"
      ></textarea>
      <button type="submit" id="submitDescription">Submit</button>
    </form>

    <span class="success-text hide" id="successMsg">Success!!</span>
    <span class="failed-text hide" id="errorMsg">ERROR</span>

    <script src="popup.js"></script>
  </body>
</html>
